# ==============================================================================
# pyproject.toml – Stemma
# Package metadata, build contents, and development tools.
# Guide: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# ==============================================================================

[build-system]
requires = ["hatchling>=1.32.3"]
build-backend = "hatchling.build"

[project]
name = "project-name"
dynamic = ["version"]
description = "A short description of the project."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name", email = "you@example.com" }]
# Choose an SPDX license expression and add its file before enabling these.
# license = "MIT"
# license-files = ["LICENSE"]
dependencies = []  # Libraries imported by src/.

# [project.urls]
# Source = "https://github.com/user/project-name"
# Issues = "https://github.com/user/project-name/issues"

# User-installable features belong in extras; contributor tools belong below.
# [project.optional-dependencies]
# plot = ["matplotlib"]

# ==============================================================================
# Build – one version source; explicit package archive contents
# ==============================================================================

[tool.hatch.version]
path = "src/project_name/__init__.py"  # Reads the literal __version__; no import.

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests"]  # Hatch also includes metadata, README and licenses.
# Add small data/reproduce inputs here only if needed to build or test the package.

# ==============================================================================
# Development – pip install -e . --group dev, or uv sync
# ==============================================================================

[dependency-groups]
dev = [
  "build>=1.6",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "ruff==0.16.8",  # Keep in sync with .pre-commit-config.yaml.
  # "pytest-cov",  # Enable when coverage helps guide tests.
]
# Analysis-only dependencies stay out of the published package's requirements.
# analysis = ["numpy", "scipy", "matplotlib", "ipykernel"]  # uv sync --group analysis

[tool.ruff]
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "reproduce/**/*.py"]

[tool.ruff.lint]
# Correctness, imports, common bugs, modernization, debuggers, invalid escapes.
# The formatter owns layout; long prose and URLs need no lint exception.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "T10", "W6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
# Register project-specific markers here before using them.
# markers = ["slow: expensive numerical checks (exclude with -m 'not slow')"]
