# ==============================================================================
# ci.yml – Stemma (project CI)
#
# Tests editable and built installations; checks formatting and repository hygiene.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Build and install wheel from sdist
        if: matrix.python-version == '3.14'
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
      - name: Test
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          pre-commit run --all-files
