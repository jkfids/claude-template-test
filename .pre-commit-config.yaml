# ==============================================================================
# .pre-commit-config.yaml – Stemma
#
# Setup (once per clone): pre-commit install
# Run everything: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
# ==============================================================================


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # On project initialization, replace the `exclude` regex below with the
      # following:
      #   files: '^([^/]+|(src|tests|data|reproduce|\.github)/.*)$'
      - id: trailing-whitespace  # Remove trailing whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^\.agents/skills/
      - id: end-of-file-fixer  # Ensure files end with a newline
        exclude: ^\.agents/skills/
      - id: check-merge-conflict  # Catch unresolved merge conflict markers
      - id: check-added-large-files  # Block large files from being committed
        args: [--maxkb=5000]
      - id: detect-private-key  # Basic protection against committing private keys
      - id: check-toml  # Validate TOML syntax
      - id: check-yaml  # Validate YAML syntax

      # Omitted by default
      # - id: no-commit-to-branch  # Prevent committing to certain branches, may interfere with Stemma's git workflow
      # - id: check-executables-have-shebangs  # Executable files must have a shebang
      # - id: check-shebang-scripts-are-executable  # Shebang implies +x
      # - id: check-json  # Validate JSON syntax
      # - id: check-symlinks  # Catch broken symlinks
      # - id: check-case-conflict  # Catch names that clash on case-insensitive filesystems

# ruff linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^(src|tests|reproduce)/
      - id: ruff-format
        files: ^(src|tests|reproduce)/

